[versions]
kotlin            = "2.0.21"
agp               = "8.7.3"
coroutines        = "1.9.0"
bouncycastle      = "1.78.1"
junit5            = "5.10.3"
junitPlatform     = "1.10.3"

# AndroidX
coreKtx           = "1.13.1"
lifecycle         = "2.8.6"
activity          = "1.9.2"
room              = "2.6.1"
composeBom        = "2024.09.02"
# Play Services Location (optional)
playLocation      = "21.3.0"

[libraries]
# Kotlin
kotlin-stdlib          = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines     = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# Crypto
bouncycastle           = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }

# AndroidX
androidx-core-ktx      = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-vm  = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-activity      = { module = "androidx.activity:activity-compose", version.ref = "activity" }
androidx-room-runtime  = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-ktx      = { module = "androidx.room:room-ktx", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
play-location          = { module = "com.google.android.gms:play-services-location", version.ref = "playLocation" }

# Compose BOM
compose-bom            = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui             = { module = "androidx.compose.ui:ui" }
compose-ui-tooling     = { module = "androidx.compose.ui:ui-tooling" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-material3      = { module = "androidx.compose.material3:material3" }
compose-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
compose-foundation     = { module = "androidx.compose.foundation:foundation" }

# Testing
junit5-api         = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit5" }
junit5-engine      = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit5" }
junit5-params      = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit5" }
junit-platform     = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junitPlatform" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library     = { id = "com.android.library", version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm          = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose      = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp                 = { id = "com.google.devtools.ksp", version = "2.0.21-1.0.28" }
